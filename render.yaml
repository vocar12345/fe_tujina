# Render Blueprint — deploys both services from this repo.
# In Render: New + -> Blueprint -> connect this repo -> Apply.
#
# Architecture:
#   - fe-tujina-bff:      NestJS BFF, Docker web service (listens on $PORT).
#   - fe-tujina-frontend: Angular static site. Its /api/* requests are rewritten
#     (server-side proxy) to the BFF, so the browser only ever talks to the
#     frontend origin — no CORS needed. The /* rewrite is the SPA fallback.
#
# NOTE: the /api rewrite destination hard-codes the BFF hostname. If Render
# assigns a different name (e.g. for uniqueness), update it to match the BFF
# service's actual onrender.com URL.
services:
  - type: web
    name: fe-tujina-bff
    runtime: docker
    rootDir: bff
    dockerfilePath: ./Dockerfile
    region: frankfurt
    plan: free
    healthCheckPath: /health

  - type: web
    name: fe-tujina-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist/frontend/browser
    region: frankfurt
    plan: free
    routes:
      - type: rewrite
        source: /api/*
        destination: https://fe-tujina-bff.onrender.com/api/*
      - type: rewrite
        source: /*
        destination: /index.html
